  const url=new URL(pdf);
  url.hash='page='+row.page+'&view=FitH';
  $('reader-link').href=url.href;
  $('reader-page').textContent=' · Tabel '+row.code+' · PDF hlm. '+row.page;
  const frame=document.createElement('iframe');
  frame.src=url.href;
  frame.title=row.title;
  $('reader-body').replaceChildren(frame);
  for(const b of $('tables').querySelectorAll('button'))b.setAttribute('aria-pressed',String(b.dataset.code===row.code));
}
const sectionNames = {
  1:'C1 · Budaya mutu', 2:'C2 · Relevansi pendidikan', 3:'C3 · Relevansi penelitian',
  4:'C4 · Relevansi pengabdian kepada masyarakat', 5:'C5 · Akuntabilitas', 6:'C6 · Diferensiasi misi'
};
function render(){
  const query=$('q').value.trim().toLowerCase();
  const terms=query.split(/\s+/);
  const rows=tables.filter(row=>{
    const section=sectionNames[row.code.split('.')[0]];
    const label=('tabel '+row.code+' '+row.title+' '+section).toLowerCase();
    return terms.every(term=>label.includes(term));
  });
  $('tables').replaceChildren();
  $('count').textContent=rows.length?rows.length+' tabel':'Tidak ada tabel yang cocok.';
  const groups=new Map();
  const initialRow=rows.includes(selected)?selected:rows[0];
  for(const row of rows){
    const number=row.code.split('.')[0];
    if(!groups.has(number)){
      const group=document.createElement('details');
      group.className='table-section';
      if(!query) group.setAttribute('name','lkps-sections');
      group.open=Boolean(query) || initialRow.code.split('.')[0]===number;
      const heading=document.createElement('summary');
      heading.append(sectionNames[number],document.createElement('span'));
      group.append(heading);
      groups.set(number,group);
      $('tables').append(group);
    }
    const button=document.createElement('button');
    button.type='button';
    button.dataset.code=row.code;
    for(const [style,text] of [['table-code',row.code],['table-name',row.title],['table-page','Hlm. '+row.page]]){
      const part=document.createElement('span');
      part.className=style;
      part.textContent=text;
      button.append(part);
    }
    button.onclick=()=>{show(row);$('reader').open=true};
    button.setAttribute('aria-pressed',String(selected===row));
    groups.get(number).append(button);
  }
  for(const group of groups.values()){
    group.querySelector('summary span').textContent=(group.childElementCount-1)+' tabel';
  }
  if(rows.length && !rows.includes(selected))show(rows[0]);
  if(!rows.length){selected=null;$('reader-page').textContent='Pilih tabel LKPS';$('reader-link').href=pdf.href;$('reader-body').replaceChildren()}
}
$('q').oninput=render;
$('reset').onclick=()=>{$('q').value='';selected=null;render();$('q').focus()};
render();
</script><script>
(() => {
  const nav = document.querySelector('.doc-switch');
  if (!nav) return;
  let start, dragged = false, suppressClick = false;
  const choose = x => nav.children[Number(x >= nav.getBoundingClientRect().left + nav.offsetWidth/2)];
  nav.addEventListener('dragstart', e => e.preventDefault());
  nav.addEventListener('pointerdown', e => {
    if (!e.isPrimary || e.button !== 0) return;
    start = e.clientX;
    dragged = suppressClick = false;
  });
  nav.addEventListener('pointermove', e => {
    if (!e.isPrimary || start == null || !e.buttons) return;
    if (!dragged && Math.abs(e.clientX-start)<6) return;
    dragged = true;
    nav.setPointerCapture(e.pointerId);
    nav.classList.add('dragging');
    const fraction = (e.clientX-nav.getBoundingClientRect().left)/nav.offsetWidth;
    nav.style.setProperty('--slide',Math.max(0,Math.min(1,2*fraction-.5))*100+'%');
  });
  function reset() {
    start = undefined;
    nav.classList.remove('dragging');
    nav.style.removeProperty('--slide');
    dragged = false;
  }
  nav.addEventListener('pointercancel',reset);
  nav.addEventListener('pointerup',e => {
    if (!e.isPrimary) return;
    const target = dragged && choose(e.clientX);
    suppressClick = dragged;
    reset();
    if (target && !target.hasAttribute('aria-current')) location.assign(target.href);
  });
  nav.addEventListener('click',e => {
    if (suppressClick || e.target.closest('[aria-current="page"]')) e.preventDefault();
    suppressClick = false;
  });
})();
</script>
